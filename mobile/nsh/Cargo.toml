[package]
name = "smude-mobile-ui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

smude-geometry = { path = "../..", default-features = false, features = ["application", "onnx-pages", "gpu-render"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pdf-writer = "0.14"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
nsh-testing = "0.4.0"
nsh-engine = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.4.0", default-features = false }
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIView", "UIResponder"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
